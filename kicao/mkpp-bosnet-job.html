<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BOSNET Job | KICAO Prototype</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link rel="stylesheet" href="../assets/kicao/fonts/KalbeFont/font.css">
    <link rel="stylesheet" href="../assets/kicao/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/kicao/css/fontawesome.min.css">
    <link rel="stylesheet" href="../assets/kicao/css/AdminLTE.min.css">
    <link rel="stylesheet" href="../assets/kicao/css/skins/_all-skins.min.css">
    <link rel="stylesheet" href="../assets/kicao/css/styles.css">
    <link rel="stylesheet" href="css/kicao-proto.css">
</head>
<body class="hold-transition skin-green sidebar-mini">
<div id="kicaoPageContent">
    <section class="content-header">
        <h1>BOSNET Close Job <small>Mock scheduler</small></h1>
    </section>
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <p>Memproses semua dokumen berstatus <strong>Waiting To Close</strong> dengan simulasi BOSNET close.</p>
                <div class="form-group">
                    <label>Fail rate simulasi (0–1)</label>
                    <input type="number" id="txtFailRate" class="form-control" style="width:120px;" min="0" max="1" step="0.1" value="0.3">
                </div>
                <button type="button" class="btn btn-warning" id="btnRunJob"><i class="fa fa-play"></i> Run Close BOSNET Job</button>
                <hr>
                <h4>Waiting To Close</h4>
                <table class="table table-bordered table-condensed" id="tblWaiting">
                    <thead><tr><th>Doc No</th><th>Status</th><th>BOSNET Note</th></tr></thead>
                    <tbody></tbody>
                </table>
                <h4>Last run result</h4>
                <pre id="preResult" style="min-height:80px;background:#f5f5f5;padding:10px;"></pre>
            </div>
        </div>
    </section>
</div>
<script src="../assets/kicao/js/jquery.min.js"></script>
<script src="../assets/kicao/js/bootstrap.min.js"></script>
<script src="../assets/kicao/js/app.min.js"></script>
<script src="../assets/kicao/js/bootbox.min.js"></script>
<script src="js/KicaoLayout.js"></script>
<script src="js/MkppStore.js"></script>
<script src="js/MkppBosnet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    KicaoLayout.init({ active: 'bosnet' });
    function refresh() {
        document.getElementById('txtFailRate').value = MkppBosnet.getFailRate();
        const rows = MkppStore.listByStatus(MkppStore.STATUS.WAITING_TO_CLOSE).map(d =>
            '<tr><td>' + d.docNo + '</td><td>' + d.status + '</td><td>' + (d.bosnetNote || '') + '</td></tr>'
        ).join('');
        document.querySelector('#tblWaiting tbody').innerHTML = rows || '<tr><td colspan="3">Tidak ada</td></tr>';
    }
    document.getElementById('btnRunJob').onclick = function () {
        MkppBosnet.setFailRate(parseFloat(document.getElementById('txtFailRate').value) || 0);
        const results = MkppBosnet.runCloseJob();
        document.getElementById('preResult').textContent = JSON.stringify(results, null, 2);
        refresh();
        KicaoLayout.toast('Job selesai: ' + results.length + ' dokumen.', 'BOSNET Job');
    };
    refresh();
});
</script>
</body>
</html>
