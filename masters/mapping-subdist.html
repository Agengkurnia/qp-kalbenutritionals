<!DOCTYPE html>
<html lang="en" class="light-style layout-navbar-fixed layout-menu-fixed" dir="ltr" data-theme="theme-default"
    data-assets-path="../assets/" data-template="vertical-menu-template">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping Subdist - Development Fund</title>
</head>

<body>
    <div id="app-content">
        <h4 class="fw-bold py-3 mb-4">
            <span class="text-muted fw-light">Master /</span> Mapping Subdist
        </h4>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label" for="filterRegion">Region</label>
                        <select id="filterRegion" class="form-select">
                            <option value="">Semua Region</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="filterGroupType">Group / Non Group</label>
                        <select id="filterGroupType" class="form-select">
                            <option value="">Semua</option>
                            <option value="Group">Group</option>
                            <option value="Non Group">Non Group</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="filterSearch">Cari</label>
                        <input type="text" id="filterSearch" class="form-control" placeholder="Kode / Nama / Titik">
                    </div>
                    <div class="col-md-2">
                        <button type="button" id="btnAddSubdist" class="btn btn-primary w-100">
                            <i class="fas fa-plus me-1"></i> Tambah
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Daftar Subdist / KMMD</h5>
                <small class="text-muted" id="subdistCountLabel">0 data</small>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="tblMappingSubdist">
                        <thead>
                            <tr>
                                <th>Kode KMMD (Bosnet)</th>
                                <th>Nama KMMD</th>
                                <th>Titik</th>
                                <th>Group</th>
                                <th>Nama Group</th>
                                <th>Branch EPM</th>
                                <th>Region</th>
                                <th>Tipe</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tblMappingSubdistBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="../js/masters/MappingSubdist/seed-data.js"></script>
    <script src="../js/masters/MappingSubdist/MappingSubdistStore.js"></script>
    <script src="../js/masters/MappingSubdist/MappingSubdist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Layout().init();
        });
        document.addEventListener('layoutReady', () => {
            MappingSubdistPage.init();
        });
    </script>
</body>

</html>
