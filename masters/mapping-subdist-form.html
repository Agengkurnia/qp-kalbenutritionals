<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect — Mapping Subdist</title>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            var target = id
                ? ('mapping-subdist.html?id=' + encodeURIComponent(id))
                : 'mapping-subdist.html?new=1';
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Mengalihkan ke Mapping Subdist… <a id="fallback" href="mapping-subdist.html">Klik di sini</a> jika tidak berpindah otomatis.</p>
    <script>
        document.getElementById('fallback').href = (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            return id
                ? ('mapping-subdist.html?id=' + encodeURIComponent(id))
                : 'mapping-subdist.html?new=1';
        })();
    </script>
</body>
</html>
